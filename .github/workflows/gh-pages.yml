name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'Makefile'
      - 'README.md'
      - 'Student/**'
      - 'Coach/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'CONTRIBUTING.md'
      - '.github/workflows/gh-pages.yml'

  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize main and preview publishing so saved previews are not overwritten.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Assemble site
        run: |
          make

      - name: Upload pull request site
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pull-request-site
          path: _site/
          if-no-files-found: error
          retention-days: 7

      - name: Read saved previews
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git worktree add --detach preview-state FETCH_HEAD
          else
            mkdir -p preview-state
          fi

      - name: Add saved previews
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if [ -d preview-state/previews ]; then
            mkdir -p _site/previews
            cp -a preview-state/previews/. _site/previews/
          fi

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  build-preview:
    name: Build Pull Request Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pages: read
    outputs:
      preview_path: ${{ steps.preview_path.outputs.value }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Assemble production site
        run: make

      - name: Download pull request site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pull-request-site
          path: pull-request-site

      - name: Set preview path
        id: preview_path
        env:
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          suffix="$(printf '%s' "${PREVIEW_NAME}" | sha256sum | cut -c1-10)"
          echo "value=previews/${PREVIEW_NAME}-${suffix}" >> "${GITHUB_OUTPUT}"

      - name: Read preview state
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git worktree add --detach preview-state FETCH_HEAD
          else
            git worktree add --orphan preview-state
            touch preview-state/.nojekyll
          fi

      - name: Save pull request preview
        env:
          PREVIEW_PATH: ${{ steps.preview_path.outputs.value }}
        run: |
          touch preview-state/.nojekyll
          rm -rf "preview-state/${PREVIEW_PATH}"
          mkdir -p "preview-state/${PREVIEW_PATH}"
          cp -a pull-request-site/. "preview-state/${PREVIEW_PATH}/"

          git -C preview-state config user.name "github-actions[bot]"
          git -C preview-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C preview-state add -- .nojekyll "${PREVIEW_PATH}"
          if ! git -C preview-state diff --cached --quiet; then
            git -C preview-state commit -m "Update preview for ${PREVIEW_PATH}"
            git -C preview-state push origin HEAD:gh-pages
          fi

      - name: Add saved previews
        run: |
          if [ -d preview-state/previews ]; then
            mkdir -p _site/previews
            cp -a preview-state/previews/. _site/previews/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site/

  deploy-preview:
    name: Deploy Pull Request Preview
    runs-on: ubuntu-latest
    needs: build-preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pages: write
      id-token: write
      pull-requests: write
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}${{ needs.build-preview.outputs.preview_path }}/"
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PATH: ${{ needs.build-preview.outputs.preview_path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          MARKER="<!-- pages-preview-url -->"
          PREVIEW_URL="${SITE_URL%/}/${PREVIEW_PATH}/"
          echo "Preview: ${PREVIEW_URL}" >> "${GITHUB_STEP_SUMMARY}"
          BODY="${MARKER}
          Preview: ${PREVIEW_URL}

          Updated for commit ${GITHUB_SHA}."
          COMMENT_ID="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${MARKER}\"))) | .id" | tail -n 1)"

          if [ -n "${COMMENT_ID}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -f body="${BODY}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${BODY}"
          fi
